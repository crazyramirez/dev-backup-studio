name: Compilar aplicaciones

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-latest
          # la más antigua con soporte: el AppImage funciona en sistemas con glibc 2.35 o posterior
          - name: Linux (x86_64)
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bibliotecas del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          # las que necesita el complemento xcb de Qt; PyInstaller las mete en la app
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-util1 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3 xvfb

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Traducciones completas
        run: python -X utf8 tools/i18n_extract.py --check

      - name: Versión
        id: version
        shell: bash
        run: |
          version=$(python tools/win_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con APP_VERSION=$version"
            exit 1
          fi

      # ── Windows: app → autoprueba → instalador → instalar, probar y desinstalar ──
      - name: Compilar app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --name "DEV Backup Studio" \
            --icon assets/icon.ico --version-file build/version_info.txt \
            --add-data "assets/tour:assets/tour" --add-data "locales:locales" backup_studio.py

      - name: Autoprueba de la app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\DEV Backup Studio\DEV Backup Studio.exe" -ArgumentList '--selftest' -Wait -PassThru
          Get-Content selftest.log
          exit $p.ExitCode

      - name: Crear instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=$PWD\dist\DEV Backup Studio" installer\windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Probar instalación y desinstalación (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = "dist\DEV-Backup-Studio-Setup-${{ steps.version.outputs.version }}.exe"
          $dir = Join-Path $env:RUNNER_TEMP "instalado"
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "el instalador terminó con $($p.ExitCode)" }
          $exe = Join-Path $dir "DEV Backup Studio.exe"
          if (-not (Test-Path $exe)) { throw "no se instaló $exe" }
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) "DEV Backup Studio.lnk"
          if (-not (Test-Path $menu)) { throw "falta el acceso del menú Inicio" }
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode) { throw "la autoprueba de la app instalada falló" }
          Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # el desinstalador se relanza desde una copia temporal: se espera a que termine de verdad
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "la desinstalación dejó la app" }
          if (Test-Path $menu) { throw "la desinstalación dejó el acceso del menú Inicio" }
          "instalar → autoprueba → desinstalar: correcto"

      # ── macOS: .app → autoprueba → .dmg ──
      - name: Compilar .app (macOS)
        if: runner.os == 'macOS'
        run: |
          version="${{ steps.version.outputs.version }}"
          pyinstaller --noconfirm --clean --windowed --name "DEV Backup Studio" \
            --icon assets/icon.png --osx-bundle-identifier com.crazyramirez.devbackupstudio \
            --add-data "assets/tour:assets/tour" --add-data "locales:locales" backup_studio.py
          plist="dist/DEV Backup Studio.app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$version" "$plist"
          plutil -replace CFBundleVersion -string "$version" "$plist"
          codesign --force --deep --sign - "dist/DEV Backup Studio.app"

      - name: Autoprueba de la .app (macOS)
        if: runner.os == 'macOS'
        run: |
          status=0
          "dist/DEV Backup Studio.app/Contents/MacOS/DEV Backup Studio" --selftest || status=$?
          cat selftest.log
          exit $status

      - name: Crear .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R "dist/DEV Backup Studio.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "DEV Backup Studio" -srcfolder dmg -ov -format UDZO \
            "dist/DEV-Backup-Studio-${{ steps.version.outputs.version }}-macOS.dmg"

      # ── Linux: app → autoprueba → AppImage → autoprueba del AppImage ──
      - name: Compilar app (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --name "DEV Backup Studio" \
            --add-data "assets/tour:assets/tour" --add-data "locales:locales" backup_studio.py

      - name: Autoprueba de la app (Linux)
        if: runner.os == 'Linux'
        run: |
          status=0
          xvfb-run -a "dist/DEV Backup Studio/DEV Backup Studio" --selftest || status=$?
          cat selftest.log
          exit $status

      - name: Crear AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum -c -
          chmod +x "$tool"
          bash installer/linux/build-appimage.sh "${{ steps.version.outputs.version }}" "$tool"
          # sin estas, la app no abre en sistemas que no las traen instaladas
          for lib in libxcb-cursor.so.0 libxcb-icccm.so.4 libxkbcommon-x11.so.0; do
            find build/AppDir -name "$lib" | grep -q . || { echo "::error::falta $lib en el AppImage"; exit 1; }
          done

      - name: Autoprueba del AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          appimage="$PWD/dist/DEV-Backup-Studio-${{ steps.version.outputs.version }}-x86_64.AppImage"
          work="$(mktemp -d)"
          cd "$work"
          status=0
          APPIMAGE_EXTRACT_AND_RUN=1 XDG_CONFIG_HOME="$work/config" XDG_DATA_HOME="$work/data" \
            xvfb-run -a "$appimage" --selftest || status=$?
          cat selftest.log
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: DEV-Backup-Studio-${{ runner.os }}
          path: |
            dist/DEV-Backup-Studio-Setup-*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publicar versión
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Notas de la versión (CHANGELOG.md)
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: build/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
